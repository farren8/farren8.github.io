<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>u died</title>
  
  <style>
    body {
      background-color: black;
    }
  </style>
</head>

<body>
    <p style="color:red; font-size: xx-large; text-align: center;">do NOT touch the tamagotchi</p>

    <img id="catGif" alt="Centered Image" height=700vh style="display: block; margin: 0 auto;">

    <script>
        function pickRandomNumber() {
            const min = 1;
            const max = 4;
            
            const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
            
            document.getElementById("catGif").src = "you-died-cats/youDied" + randomNumber + ".gif";
            
        }
        pickRandomNumber();
    </script>

    
 
</body>
